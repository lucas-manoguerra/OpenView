name: Quality

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up OpenView
        uses: ./.github/actions/setup-environment

      - name: Check formatting
        run: pnpm format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up OpenView
        uses: ./.github/actions/setup-environment

      - name: Run Biome lint
        run: pnpm lint

  architecture:
    name: Architecture boundaries
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up OpenView
        uses: ./.github/actions/setup-environment

      - name: Verify architecture
        run: pnpm architecture:check

  typecheck:
    name: TypeScript · ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - market-domain
          - chart-engine
          - market-data
          - terminal
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up OpenView
        uses: ./.github/actions/setup-environment

      - name: Check package types
        run: pnpm --filter @openview/${{ matrix.package }} typecheck

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up OpenView
        uses: ./.github/actions/setup-environment

      - name: Run Vitest
        run: pnpm test

  build:
    name: Astro build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up OpenView
        uses: ./.github/actions/setup-environment

      - name: Build terminal application
        run: pnpm build

  e2e:
    name: Browser tests · Chromium · shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up OpenView
        uses: ./.github/actions/setup-environment

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright shard
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/4

      - name: Upload browser test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  quality-gate:
    name: All quality checks
    if: always()
    needs:
      - format
      - lint
      - architecture
      - typecheck
      - unit-tests
      - build
      - e2e
    runs-on: ubuntu-latest
    env:
      FORMAT_RESULT: ${{ needs.format.result }}
      LINT_RESULT: ${{ needs.lint.result }}
      ARCHITECTURE_RESULT: ${{ needs.architecture.result }}
      TYPECHECK_RESULT: ${{ needs.typecheck.result }}
      UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
      BUILD_RESULT: ${{ needs.build.result }}
      E2E_RESULT: ${{ needs.e2e.result }}
    steps:
      - name: Require every quality check to pass
        shell: bash
        run: |
          check_results=(
            "format=${FORMAT_RESULT}"
            "lint=${LINT_RESULT}"
            "architecture=${ARCHITECTURE_RESULT}"
            "typecheck=${TYPECHECK_RESULT}"
            "unit-tests=${UNIT_TESTS_RESULT}"
            "build=${BUILD_RESULT}"
            "e2e=${E2E_RESULT}"
          )

          failed=0

          for check_result in "${check_results[@]}"; do
            check_name="${check_result%%=*}"
            result="${check_result#*=}"

            if [[ "${result}" != "success" ]]; then
              printf '::error title=Quality check failed::%s finished with %s\n' "${check_name}" "${result}"
              failed=1
            fi
          done

          if [[ "${failed}" -ne 0 ]]; then
            exit 1
          fi

          printf 'All OpenView quality checks passed.\n'
