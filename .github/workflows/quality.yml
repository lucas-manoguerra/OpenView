name: Quality

on:
  push:
    branches:
      - main
      - "chore/**"
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, architecture, types, tests, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.23.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.3

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Apply canonical formatting
        run: pnpm format

      - name: Commit generated lockfile and formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: apply canonical formatting and lockfile"
          git push origin HEAD

      - name: Run quality checks
        run: pnpm check

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm test:e2e
