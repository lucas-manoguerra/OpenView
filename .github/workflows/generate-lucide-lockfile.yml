name: Generate dependency lockfile

on:
  push:
    branches:
      - feat/lucide-icon-system

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.23.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.3
      - name: Resolve workspace lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - uses: actions/upload-artifact@v6
        with:
          name: lucide-lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
