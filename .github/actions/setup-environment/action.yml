name: Setup OpenView Environment
description: Install the pinned Node.js, pnpm, and workspace dependencies

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 12.23.0

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24.22.3
        cache: pnpm

    - name: Install workspace dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
